<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perya Color Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
      <button id="rollBtn" class="roll-btn">ROLL</button>
    </div>
  </div>

  <main id="adminPage" class="admin-page" aria-label="Perya Color Game Admin">
    <header class="admin-topbar">
      <div>
        <p class="admin-kicker">Operator Dashboard</p>
        <h1>PERYA COLOR GAME ADMIN</h1>
      </div>
      <div class="admin-top-actions">
        <span id="connectionStatus" class="connection-pill waiting">Waiting for Public Display...</span>
        <a class="admin-public-link" href="/" data-route>Public Game</a>
      </div>
    </header>

    <section class="admin-grid">
      <section class="admin-card admin-card-wide">
        <div class="admin-card-header">
          <h2>Game Status</h2>
          <span id="statusMode" class="admin-pill">Fair Random</span>
        </div>
        <div class="status-grid">
          <div><span>Current Phase</span><strong id="statusPhase">Idle</strong></div>
          <div class="countdown-status">
            <span>Countdown</span>
             <span id="countdownBar"></span>
            <strong id="statusCountdown">5 seconds</strong>
          </div>
          <div><span>Current Round</span><strong id="statusRound">1</strong></div>
        </div>
        <div class="admin-actions">
          <button id="adminStartRound" class="admin-btn primary">Start Round</button>
          <button id="adminForceRoll" class="admin-btn">Force Roll</button>
          <button id="adminReset" class="admin-btn">Reset Round</button>
          <button id="adminClearHistoryTop" class="admin-btn danger">Clear History</button>
        </div>
      </section>

      <section class="admin-card">
        <h2>Timing</h2>
        <label class="admin-range">
          <span>Countdown Duration <output id="countdownValue">5s</output></span>
          <input id="setCountdown" type="range" min="1" max="30" step="1" value="5">
        </label>
        <label class="admin-range">
          <span>Rolling Duration <output id="rollValue">3s</output></span>
          <input id="setRollTime" type="range" min="1" max="15" step="0.5" value="3">
        </label>
        <label class="admin-range">
          <span>Reveal Duration <output id="revealValue">6s</output></span>
          <input id="setReveal" type="range" min="1" max="30" step="0.5" value="6">
        </label>
      </section>

      <section class="admin-card">
        <h2>Result Mode</h2>
        <div class="radio-stack">
          <label><input type="radio" name="resultMode" value="fair" checked> Fair Random</label>
          <label><input type="radio" name="resultMode" value="manual"> Manual Result</label>
        </div>
        <div id="manualResultControls" class="manual-result hidden">
          <label>Die 1<select id="manualDie1"></select></label>
          <label>Die 2<select id="manualDie2"></select></label>
          <label>Die 3<select id="manualDie3"></select></label>
        </div>
        <div class="result-preview-block">
          <span>Preview</span>
          <div id="manualPreview" class="dice-preview"></div>
        </div>
      </section>

      <section class="admin-card admin-card-wide">
        <div class="admin-card-header">
          <h2>Recent History</h2>
          <div class="admin-actions compact">
            <button id="adminClearHistory" class="admin-btn danger">Clear History</button>
            <button id="adminExportHistory" class="admin-btn">Export History (JSON)</button>
          </div>
        </div>
        <div id="adminHistory" class="admin-history"></div>
      </section>
      
      <section class="admin-card admin-card-wide">
        <h2>Settings</h2>
        <div class="settings-grid">
          <label class="admin-switch"><span>Sound</span><input id="setSound" type="checkbox" checked></label>
          <label class="admin-switch"><span>Auto Roll</span><input id="setAutoRoll" type="checkbox"></label>
          <label class="admin-range">
            <span>Music Volume <output id="musicVolumeValue">50%</output></span>
            <input id="setMusicVolume" type="range" min="0" max="1" step="0.05" value="0.5">
          </label>
          <label class="admin-range">
            <span>Effects Volume <output id="effectsVolumeValue">100%</output></span>
            <input id="setEffectsVolume" type="range" min="0" max="1" step="0.05" value="1">
          </label>
          <label class="admin-range">
            <span>Auto Roll Interval <output id="autoRollIntervalValue">0.4s</output></span>
            <input id="setAutoRollInterval" type="range" min="0.4" max="30" step="0.1" value="0.4">
          </label>
        </div>
      </section>
    </section>
  </main>

  <script src="GameObject.js"></script>
  <script src="die.js"></script>
  <script src="ColorTile.js"></script>
  <script src="CabinetLight.js"></script>
  <script src="Particle.js"></script>
  <script src="BroadcastManager.js"></script>
  <script src="AdminPanel.js"></script>
  <script src="CabinetRenderer.js"></script>
  <script src="Game.js"></script>
  <script>
    const isAdminRoute = window.location.pathname.replace(/\/+$/, '') === '/admin' ||
      window.location.hash === '#admin' ||
      new URLSearchParams(window.location.search).has('admin');
    const broadcast = new BroadcastManager(isAdminRoute ? 'admin' : 'public');
    document.body.classList.toggle('admin-route', isAdminRoute);
    document.body.classList.toggle('public-route', !isAdminRoute);

    if (isAdminRoute) {
      window.adminPanel = new AdminPanel(broadcast);
    } else {
      const game = new Game(document.getElementById('gameCanvas'), broadcast);
      window.game = game;
    }
  </script>
</body>
</html>
